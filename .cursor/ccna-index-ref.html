<title>CCNA Lab Workbook</title>
<meta name="description" content="Hands-on Packet Tracer labs and exam drills for every CCNA 200-301 v1.1 topic.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ground:#EDF0F4; --panel:#FFFFFF; --panel-2:#F5F7FA; --ink:#141C26; --muted:#54626F; --faint:#8492A0;
  --rule:#D5DCE3; --rule-strong:#BAC4CD; --code-bg:#0E1826; --code-ink:#D7E3F0; --code-rule:#22364C;
  --accent:#0B63C4; --accent-ink:#FFFFFF; --accent-soft:#DCE9F9;
  --d1:#C2410C; --d2:#15803D; --d3:#1D4ED8; --d4:#9A5B1E; --d5:#B4232B; --d6:#6D28D9;
  --d1-soft:#FAE7DB; --d2-soft:#DDF0E3; --d3-soft:#DEE6FB; --d4-soft:#F4E7D6; --d5-soft:#F8DEDF; --d6-soft:#EAE0FB;
  --ok:#1F7A46; --ok-soft:#DBEFE2; --warn:#9A5B00; --warn-soft:#F7EACF; --bad:#B4232B; --bad-soft:#F8DEDF;
  --shadow:0 1px 2px rgba(20,28,38,.06),0 4px 14px rgba(20,28,38,.06);
  --f-display:"Red Hat Display",system-ui,sans-serif;
  --f-body:"Red Hat Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B121B; --panel:#131C27; --panel-2:#18242F; --ink:#E4EBF2; --muted:#98A6B4; --faint:#697787;
    --rule:#243240; --rule-strong:#334454; --code-bg:#080F18; --code-ink:#CBDAEA; --code-rule:#1D2E40;
    --accent:#4D9BE8; --accent-ink:#05121F; --accent-soft:#123049;
    --d1:#E8813F; --d2:#4EB877; --d3:#5B8CF0; --d4:#D19A56; --d5:#EC6B72; --d6:#A987EA;
    --d1-soft:#2E1E12; --d2-soft:#14291C; --d3-soft:#152238; --d4-soft:#2C2113; --d5-soft:#331519; --d6-soft:#221833;
    --ok:#4EB877; --ok-soft:#14291C; --warn:#D6A03E; --warn-soft:#2E2411; --bad:#EC6B72; --bad-soft:#331519;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --ground:#0B121B; --panel:#131C27; --panel-2:#18242F; --ink:#E4EBF2; --muted:#98A6B4; --faint:#697787;
  --rule:#243240; --rule-strong:#334454; --code-bg:#080F18; --code-ink:#CBDAEA; --code-rule:#1D2E40;
  --accent:#4D9BE8; --accent-ink:#05121F; --accent-soft:#123049;
  --d1:#E8813F; --d2:#4EB877; --d3:#5B8CF0; --d4:#D19A56; --d5:#EC6B72; --d6:#A987EA;
  --d1-soft:#2E1E12; --d2-soft:#14291C; --d3-soft:#152238; --d4-soft:#2C2113; --d5-soft:#331519; --d6-soft:#221833;
  --ok:#4EB877; --ok-soft:#14291C; --warn:#D6A03E; --warn-soft:#2E2411; --bad:#EC6B72; --bad-soft:#331519;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,kbd{font-family:var(--f-mono)}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand .code{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--rule-strong);border-radius:3px;padding:1px 6px}
.tabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--rule);border-radius:6px;padding:3px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.overall{margin-left:auto;display:flex;align-items:center;gap:12px}
.overall .num{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.overall .big{font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--ink)}
.domstrip{display:flex;height:4px}
.domstrip span{flex:var(--w)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on::before{background:var(--ok)}

.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;max-width:1480px;margin:0 auto}
.side{border-right:1px solid var(--rule);padding:18px 14px 40px;position:sticky;top:62px;align-self:start;max-height:calc(100vh - 62px);overflow:auto}
.main{padding:22px 28px 80px;min-width:0}
.dom{margin-bottom:12px}
.dom-h{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:5px;cursor:pointer}
.dom-h:hover{background:var(--panel-2)}
.dom-h.sel{background:var(--panel);box-shadow:var(--shadow)}
.dnum{font-family:var(--f-mono);font-weight:700;font-size:12px;color:#fff;background:var(--dc);border-radius:3px;padding:1px 5px}
:root[data-theme="dark"] .dnum{color:#0B121B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dnum{color:#0B121B}}
.dname{font-family:var(--f-display);font-weight:600;font-size:14.5px}
.dw{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.meter{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.dom .meter{margin:4px 8px 6px}
.meter i{display:block;height:100%;background:var(--mc,var(--accent));width:0;transition:width .3s}
.objs{list-style:none;margin:0;padding:0}
.objs button{display:grid;grid-template-columns:38px 1fr auto;gap:6px;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:13px;color:var(--muted);align-items:baseline}
.objs button:hover{background:var(--panel-2);color:var(--ink)}
.objs button.sel{color:var(--ink);background:var(--panel-2);box-shadow:inset 2px 0 0 var(--dc)}
.objs .on{font-family:var(--f-mono);font-size:12px;color:var(--dc)}
.objs .oc{font-family:var(--f-mono);font-size:11px}
.side-all{width:100%;text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:5px;padding:7px 10px;margin-bottom:14px;cursor:pointer;font-weight:500;font-size:13.5px}
.side-all.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters input[type=search]{flex:1 1 240px;min-width:0;padding:8px 12px;border:1px solid var(--rule-strong);border-radius:5px;background:var(--panel)}
.filters select{padding:7px 10px;border:1px solid var(--rule-strong);border-radius:5px;background:var(--panel)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--rule-strong);background:var(--panel);border-radius:5px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:3px 9px;font-size:12.5px}

.objsec{margin:0 0 30px}
.objsec-h{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:end;padding-bottom:10px;border-bottom:2px solid var(--dc);margin-bottom:12px}
.objsec-h .on{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;color:var(--dc)}
.objsec-h h2{font-size:18px;font-weight:600}
.objsec-h .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

.lab{background:var(--panel);border:1px solid var(--rule);border-radius:6px;margin-bottom:8px}
.lab[open]{box-shadow:var(--shadow);border-color:var(--rule-strong)}
.lab>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px}
.lab>summary::-webkit-details-marker{display:none}
.lid{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--dc);background:var(--dsoft);border-radius:3px;padding:3px 0;text-align:center}
.lt{font-weight:600;font-size:15px;line-height:1.35}
.lmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px}
.lmeta span{white-space:nowrap}
.diff{letter-spacing:1px;color:var(--dc)}
.kind{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.lright{display:flex;align-items:center;gap:10px}
.pill{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.ns{background:var(--panel-2);color:var(--muted);border:1px solid var(--rule)}
.pill.ip{background:var(--warn-soft);color:var(--warn)}
.pill.dn{background:var(--ok-soft);color:var(--ok)}
.ring{width:26px;height:26px}
.labbody{padding:4px 18px 18px 92px;border-top:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{font-size:12px;border:1px solid var(--rule);border-radius:3px;padding:1px 7px;color:var(--muted);background:var(--panel-2)}
.chip.cost{border-color:transparent;background:var(--accent-soft);color:var(--ink)}
.goal{margin:12px 0;max-width:72ch}
.blk-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps>li{counter-increment:s;display:grid;grid-template-columns:22px 26px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px dashed var(--rule)}
ol.steps>li:first-child{border-top:0}
ol.steps>li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:2px;text-align:right}
ol.steps input[type=checkbox]{width:17px;height:17px;margin:3px 0 0;accent-color:var(--ok);cursor:pointer}
ol.steps li.done .stxt{color:var(--muted)}
.stxt{max-width:78ch}
.stxt p{margin:0}
.code{position:relative;margin:8px 0 2px;background:var(--code-bg);border:1px solid var(--code-rule);border-radius:5px}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;font-size:12.6px;line-height:1.55;color:var(--code-ink);white-space:pre}
.code .cp{position:absolute;top:5px;right:5px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--code-rule);background:#12203180;color:var(--code-ink);border-radius:3px;padding:1px 7px;cursor:pointer;opacity:.85}
.code .cp:hover{opacity:1}
.stxt code,.goal code,.note code,.pbq code{background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;padding:0 4px;font-size:.88em;color:var(--ink)}
.code pre code{background:none;border:0;border-radius:0;padding:0;font-size:inherit;color:var(--code-ink)}
.note{border-left:3px solid var(--nc);background:var(--ns);padding:10px 14px;border-radius:0 5px 5px 0;margin:10px 0;max-width:80ch}
.note b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--nc);margin-bottom:3px}
.note.verify{--nc:var(--ok);--ns:var(--ok-soft)}
.note.break{--nc:var(--bad);--ns:var(--bad-soft)}
.note.tip{--nc:var(--accent);--ns:var(--accent-soft)}
.note.warn{--nc:var(--warn);--ns:var(--warn-soft)}
.labfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.cov-obj{background:var(--panel);border:1px solid var(--rule);border-radius:6px;margin-bottom:12px;overflow:hidden}
.cov-obj h3{font-size:15px;padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:baseline}
.cov-obj h3 .on{font-family:var(--f-mono);color:var(--dc);font-size:13px}
.cov-wrap{overflow-x:auto}
table.cov{width:100%;border-collapse:collapse;font-size:13.5px}
table.cov td{padding:6px 14px;border-top:1px solid var(--rule);vertical-align:top}
table.cov tr:first-child td{border-top:0}
table.cov td:first-child{width:44%;color:var(--ink)}
.lk{font-family:var(--f-mono);font-size:12px;border:1px solid var(--rule);background:var(--panel-2);border-radius:3px;padding:0 6px;margin:0 4px 3px 0;cursor:pointer;color:var(--ink)}
.lk.done{border-color:var(--ok);color:var(--ok)}
.gap{font-size:12px;color:var(--bad);font-weight:600}
.covsum{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 22px}
.covsum div{display:flex;flex-direction:column}
.covsum b{font-family:var(--f-display);font-size:28px;line-height:1.1}
.covsum span{font-size:12.5px;color:var(--muted)}

.pbq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:24px}
.pbq-card{text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pbq-card:hover{border-color:var(--rule-strong)}
.pbq-card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pbq-card .t{font-weight:600}
.pbq-card .m{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pbq{background:var(--panel);border:1px solid var(--rule-strong);border-radius:6px;padding:20px 22px;box-shadow:var(--shadow)}
.pbq h2{font-size:21px;margin-bottom:6px}
.pbq .prompt{max-width:80ch;margin:8px 0 14px}
.exhibit{background:var(--code-bg);border:1px solid var(--code-rule);border-radius:5px;overflow-x:auto;margin:10px 0 16px}
.exhibit pre{margin:0;padding:12px 14px;font-size:12.6px;line-height:1.55;color:var(--code-ink)}
.exhibit .ln{display:grid;grid-template-columns:28px 32px minmax(max-content,1fr);align-items:start;padding:1px 10px;font-family:var(--f-mono);font-size:12.6px;white-space:pre;cursor:pointer;color:var(--code-ink)}
.exhibit .ln:hover{background:#1b2c40}
.exhibit .ln .n{color:var(--faint);text-align:right;padding-right:8px}
.exhibit .ln.right{background:#123a24;color:#bff0d0}
.exhibit .ln.wrong{background:#3a1a1d;color:#f6c9cc}
.exhibit .ln.missed{box-shadow:inset 3px 0 0 var(--warn)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,260px);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.qrow:first-of-type{border-top:0}
.qrow select,.qrow input{width:100%;padding:6px 8px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--panel)}
.qrow.right select,.qrow.right input{border-color:var(--ok);background:var(--ok-soft)}
.qrow.wrong select,.qrow.wrong input{border-color:var(--bad);background:var(--bad-soft)}
.why{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-2px}
.why b{color:var(--ink)}
.order{list-style:none;margin:0;padding:0}
.order li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--rule);border-radius:4px;margin-bottom:6px;background:var(--panel-2)}
.order li .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.order li.right{border-color:var(--ok);background:var(--ok-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.order .mv{display:flex;gap:4px}
.order .mv button{border:1px solid var(--rule-strong);background:var(--panel);border-radius:3px;width:28px;height:26px;cursor:pointer}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0 16px}
.zone{border:1px dashed var(--rule-strong);border-radius:5px;padding:8px 10px;background:var(--panel-2)}
.zone b{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block}
.zone span{font-size:12.5px;color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);flex-wrap:wrap}
.score .s{font-family:var(--f-display);font-size:24px;font-weight:800}

.prose{max-width:76ch}
.prose h2{font-size:23px;margin:26px 0 8px}
.prose h3{font-size:16px;margin:20px 0 6px}
.prose p,.prose li{margin:6px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:14px 0 20px}
.facts div{background:var(--panel);padding:10px 14px}
.facts b{display:block;font-family:var(--f-display);font-size:18px}
.facts span{font-size:12.5px;color:var(--muted)}
.weights{display:flex;height:34px;border-radius:5px;overflow:hidden;margin:10px 0 4px}
.weights div{flex:var(--w);background:var(--dc);color:#fff;font-family:var(--f-mono);font-size:11.5px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
:root[data-theme="dark"] .weights div{color:#0B121B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .weights div{color:#0B121B}}
textarea.io{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;padding:10px;border:1px solid var(--rule-strong);border-radius:5px;background:var(--code-bg);color:var(--code-ink)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 16px;border-radius:5px;font-size:13.5px;z-index:50}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--rule-strong);border-radius:6px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px}
  .side-all{grid-column:1/-1}
  .main{padding:18px 14px 60px}
  .labbody{padding:4px 14px 16px}
  .lab>summary{grid-template-columns:56px minmax(0,1fr)}
  .lright{grid-column:1/-1;justify-content:flex-start}
  .overall{margin-left:0}
  .qrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
